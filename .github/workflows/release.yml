name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Require matching package version and main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main

  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read

  publish:
    name: Publish verified installers
    needs: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Download this run's installer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'LifeKernelOS-*' --dir release-assets
      - name: Require all architectures, installer formats and matching checksums
        run: node scripts/check-release-assets.mjs release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          test "${#assets[@]}" -gt 0
          cat > release-notes.md <<'NOTES'
          macOS（Apple Silicon ARM64 / Intel x64）：DMG 与 ZIP；Windows（ARM64 / x64）：NSIS 安装包；另保留 Linux x64 AppImage 与 tar.gz。请下载与你的系统和处理器匹配的文件。

          安装包未签名，macOS/Windows 可能需要在系统中确认运行。每个安装包提供 SHA-256；当前没有自动升级或云同步。

          五个原生目标的自动化、打包资源与闭环检查全部通过，并核对八个安装包及哈希后才发布。真实 Key/模型、系统密钥服务、原生对话框、全局快捷键与实机安装仍需人工验收。
          NOTES
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag --title "LifeKernelOS $RELEASE_TAG" --notes-file release-notes.md --generate-notes "${flags[@]}"
